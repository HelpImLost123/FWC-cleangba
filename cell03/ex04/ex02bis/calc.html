<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="calc.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="calc.js" defer></script>
    </head>
    <body>
        <div class="container">
            <div class="inner">
                <input id="left">
                <select id="operator">
                    <option value="+"> + </option>
                    <option value="-"> - </option>
                    <option value="*"> * </option>
                    <option value="/"> / </option>
                    <option value="%"> % </option>
                </select>
                <input id="right">
            </div>
            <button id="submit"> Try Me! </button>
        </div>
    </body>
</html>
